# =============================================================================
# VireHire AI — Render Deployment Configuration
# =============================================================================
# This file defines all three services for deployment on Render.com
# Deploy via: https://dashboard.render.com → New → Blueprint
# Or connect this repo and Render will auto-detect this file.
# =============================================================================

services:

  # ── Spring Boot API ─────────────────────────────────────────────────────────
  - type: web
    name: virehire-api
    runtime: docker
    dockerfilePath: ./springboot/Dockerfile
    dockerContext: ./springboot
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JDBC_URL
        sync: false          # Set manually in Render dashboard (jdbc:postgresql://... format)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          name: virehire-python-ai
          type: web
          property: host
      - key: AI_SERVICE_TIMEOUT_MINUTES
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # Set to your Vercel frontend URL after deploy
      - key: LOG_LEVEL
        value: "INFO"
      - key: JPA_SHOW_SQL
        value: "false"

  # ── Python AI Service ───────────────────────────────────────────────────────
  - type: web
    name: virehire-python-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Same Neon URL as Spring Boot
      - key: JWT_SECRET
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false          # Set to Spring Boot Render URL + Vercel frontend URL
      - key: LOG_LEVEL
        value: "INFO"
      - key: DEBUG
        value: "false"
