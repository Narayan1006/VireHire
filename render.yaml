services:
  - type: web
    name: verihire-api-v2
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt && python scripts/download_model.py
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "https://web-zeta-ruddy-39.vercel.app,http://localhost:5173"
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ENV
        value: production
