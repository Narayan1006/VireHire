# =============================================================================
# VireHire AI — Render Deployment Configuration (Firebase Firestore)
# =============================================================================

services:

  # ── Spring Boot API ─────────────────────────────────────────────────────────
  - type: web
    name: virehire-api
    runtime: docker
    dockerfilePath: ./springboot/Dockerfile
    dockerContext: ./springboot
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false          # Raw JSON contents of serviceAccountKey.json
      - key: JWT_SECRET
        sync: false          # Secret string for JWT token signing
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          name: virehire-python-ai
          type: web
          property: host
      - key: AI_SERVICE_TIMEOUT_MINUTES
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://virehire-cdd94.web.app"
      - key: LOG_LEVEL
        value: "INFO"

  # ── Python AI Service ───────────────────────────────────────────────────────
  - type: web
    name: virehire-python-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false          # Same raw Firebase JSON
      - key: JWT_SECRET
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://virehire-cdd94.web.app"
      - key: LOG_LEVEL
        value: "INFO"
      - key: DEBUG
        value: "false"
