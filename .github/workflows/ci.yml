name: CI

on:
  push:
    branches: [ "main", "v2/rebuild" ]
  pull_request:
    branches: [ "main", "v2/rebuild" ]

jobs:
  api:
    name: API (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: verihire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d verihire"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/verihire
      CI: "true"
      REQUIRE_POSTGRES: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff Lint
        run: python -m ruff check .

      - name: Run Migrations on Test Database
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/verihire

      - name: Run Pytest Suite
        run: python -m pytest -v -rs

      - name: Verify Postgres Tests Ran (Disallow Skips)
        run: python -m pytest -m postgres -v --tb=short


  web:
    name: Web (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
